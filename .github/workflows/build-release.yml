name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure (Visual Studio 2022 x64)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: |
          cmake --build build --config Release --parallel

      - name: Locate executable
        id: find_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "NovaResearch.exe" | Select-Object -First 1
          if (-not $exe) { throw "NovaResearch.exe not found" }
          Write-Host "Found: $($exe.FullName)"
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "exe_name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaResearch-Windows-x64
          path: ${{ steps.find_exe.outputs.exe_path }}
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: NovaResearch ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          body: |
            ## NovaResearch ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}

            CS2 Architectural Visual Research Demo (Windows x64)

            ### Assets
            - `NovaResearch.exe` – standalone executable

            ### Notes
            - Pure offline simulation. Does not interact with any game.
            - Built with CMake + MSVC + GLFW + Dear ImGui + OpenGL
          files: ${{ steps.find_exe.outputs.exe_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
