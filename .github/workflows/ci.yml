name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Check executable exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "NovaResearch.exe" | Select-Object -First 1
          if (-not $exe) { throw "NovaResearch.exe not found after build" }
          Write-Host "Build successful: $($exe.FullName)"
          Write-Host "Size: $([math]::Round($exe.Length / 1KB, 1)) KB"
